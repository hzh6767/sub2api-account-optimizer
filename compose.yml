services:
  optimizer:
    profiles: ["optimizer"]
    build:
      context: .
    image: "${OPTIMIZER_IMAGE:-sub2api-account-optimizer:0.1.0}"
    container_name: "${OPTIMIZER_CONTAINER_NAME:-sub2api-account-optimizer}"
    restart: unless-stopped
    environment:
      OPTIMIZER_ROOT: /app
      OPTIMIZER_GROUP_IDS: "${OPTIMIZER_GROUP_IDS:-7,59}"
      OPTIMIZER_LOOP_INTERVAL_SECONDS: "${OPTIMIZER_LOOP_INTERVAL_SECONDS:-600}"
      OPTIMIZER_ROUND_TIMEOUT_SECONDS: "${OPTIMIZER_ROUND_TIMEOUT_SECONDS:-480}"
      OPTIMIZER_APPLY_ENABLED: "${OPTIMIZER_APPLY_ENABLED:-false}"
      OPTIMIZER_ACTIVE_PROBES_ENABLED: "${OPTIMIZER_ACTIVE_PROBES_ENABLED:-false}"
      OPTIMIZER_TARGETED_TEST_SAFE: "${OPTIMIZER_TARGETED_TEST_SAFE:-false}"
      OPTIMIZER_PROBE_MODEL_PREFERENCE: "${OPTIMIZER_PROBE_MODEL_PREFERENCE:-gpt-5.6-terra,gpt-5.6-sol,gpt-5.5}"
      OPTIMIZER_PROBE_INPUT_TOKENS_ESTIMATE: "${OPTIMIZER_PROBE_INPUT_TOKENS_ESTIMATE:-16}"
      SUB2API_ADMIN_BASE_URL: "${SUB2API_ADMIN_BASE_URL:-http://sub2api:8080}"
      SUB2API_ADMIN_API_KEY_FILE: /run/secrets/sub2api_admin_api_key
      SUB2API_MODEL_PRICING_FILE: /app/config/model_pricing.json
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      DATABASE_PORT: "${DATABASE_PORT:-5432}"
      POSTGRES_DB: "${POSTGRES_DB:-sub2api}"
      POSTGRES_USER: "${POSTGRES_USER:-sub2api}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
      REDIS_HOST: "${REDIS_HOST:-redis}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
      - ./backups:/app/backups
      - ${SUB2API_MODEL_PRICING_SOURCE:-../data/model_pricing.json}:/app/config/model_pricing.json:ro
    secrets:
      - sub2api_admin_api_key
    networks:
      - sub2api-network
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-m", "optimizer.cli", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  sub2api-network:
    external: true
    name: "${SUB2API_DOCKER_NETWORK:-sub2api_sub2api-network}"

secrets:
  sub2api_admin_api_key:
    file: ${OPTIMIZER_ADMIN_API_KEY_SOURCE:-./secrets/.gitkeep}
