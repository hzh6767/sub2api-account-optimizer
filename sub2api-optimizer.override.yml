services:
  sub2api:
    image: "${SUB2API_OPTIMIZER_IMAGE:-sub2api:0.1.141-account-optimizer}"
    environment:
      GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_PRIORITY: "${OPENAI_SCHEDULER_PRIORITY_WEIGHT:-0.6}"
      GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_LOAD: "${OPENAI_SCHEDULER_LOAD_WEIGHT:-1.0}"
      GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_QUEUE: "${OPENAI_SCHEDULER_QUEUE_WEIGHT:-0.8}"
      GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_ERROR_RATE: "${OPENAI_SCHEDULER_ERROR_RATE_WEIGHT:-1.5}"
      GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_TTFT: "${OPENAI_SCHEDULER_TTFT_WEIGHT:-1.2}"
      GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_RESET: "${OPENAI_SCHEDULER_RESET_WEIGHT:-0.0}"
      GATEWAY_OPENAI_WS_SCHEDULER_SCORE_WEIGHTS_QUOTA_HEADROOM: "${OPENAI_SCHEDULER_QUOTA_WEIGHT:-0.0}"
      GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_ENABLED: "${OPENAI_STICKY_ESCAPE_ENABLED:-true}"
      GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_TTFT_MS: "${OPENAI_STICKY_ESCAPE_TTFT_MS:-15000}"
      GATEWAY_OPENAI_SCHEDULER_STICKY_ESCAPE_ERROR_RATE: "${OPENAI_STICKY_ESCAPE_ERROR_RATE:-0.5}"
